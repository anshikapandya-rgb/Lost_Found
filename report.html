<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoundIt - Report Property</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="form-card" style="max-width: 600px;">
        <h2>Register Property Record</h2>
        <p><small>Submit details for a lost or discovered item on campus grounds.</small></p>

        <form>
            <label><strong>Report Type</strong></label>
            <select required>
                <option value="lost">I lost an item</option>
                <option value="found">I found and turned in an item</option>
            </select>

            <label><strong>Item Name / Title</strong></label>
            <input type="text" placeholder="e.g. Casio Scientific Calculator / Blue Hydro Flask" required>

            <label><strong>Category</strong></label>
            <select required>
                <option value="electronics">Electronics & Gadgets</option>
                <option value="stationery">Books & Stationery</option>
                <option value="personal">ID Cards & Personal Belongings</option>
                <option value="clothing">Clothing & Accessories</option>
            </select>

            <label><strong>Campus Location Last Seen / Found</strong></label>
            <input type="text" placeholder="e.g. Design Studio 3 or Central Library 2nd Floor" required>

            <label><strong>Detailed Description</strong></label>
            <textarea rows="4" placeholder="Mention color, brand, stickers, or unique identifying marks..."
                required></textarea>

            <button type="submit" style="width: 100%;">Submit Official Report</button>
        </form>

        <div style="text-align: center; margin-top: 15px;">
            <a href="index.html" style="color: #718096; text-decoration: none;">← Back to Home</a>
        </div>
    </div>

</body>

</html>
